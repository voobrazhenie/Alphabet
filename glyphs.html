<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nine-Hole Alphabet Generator</title>
<style>
:root{--bg:#0b0b0c;--panel:#151517;--ink:#f1efe8;--muted:#96938b;--line:#303036;--accent:#d8ff65}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:1200px;margin:auto;padding:18px}
h1{font-size:clamp(2rem,10vw,4rem);margin:10px 0 8px;line-height:.95}
p{color:#c7c4bc;line-height:1.45}
.layout{display:grid;grid-template-columns:300px 1fr;gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px}
.glyph{aspect-ratio:1;background:#080809;border-radius:9px;display:grid;place-items:center}
.glyph svg{width:90%;height:90%}
.cap{display:flex;justify-content:space-between;margin-top:7px;font-size:.8rem}
.seed{color:var(--muted);font-size:.62rem}
input[type=text]{width:100%;padding:12px;background:#0d0d0f;color:var(--ink);border:1px solid var(--line);border-radius:9px;font-size:1rem}
input[type=range]{width:100%}
label{display:block;margin:12px 0 4px;color:#bbb8b0;font-size:.82rem}
.big{aspect-ratio:1;background:#080809;border-radius:12px;margin-top:14px;display:grid;place-items:center}
.big svg{width:88%;height:88%}
button{width:100%;margin-top:10px;padding:11px;border:1px solid #52632c;background:#1a1a1e;color:var(--accent);border-radius:9px}
.note{font-size:.75rem;color:var(--muted);margin-top:10px}
@media(max-width:760px){.layout{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.panel{position:static}}
</style>
</head>
<body>
<div class="wrap">
<h1>Nine-Hole Alphabet</h1>
<p>Deterministic glyph prototype. Each A–Z letter always generates the same mark for the same style settings.</p>

<div class="layout">
<aside class="panel">
<label>Letter</label>
<input id="letter" type="text" value="A" maxlength="1" inputmode="text" autocapitalize="characters">

<label>Complexity</label><input id="complexity" type="range" min="2" max="8" value="5">
<label>Curvature</label><input id="curvature" type="range" min="0" max="100" value="42">
<label>Jitter</label><input id="jitter" type="range" min="0" max="28" value="7">
<label>Stroke weight</label><input id="weight" type="range" min="1" max="8" value="3">

<div class="big" id="big"></div>
<button id="reset">Reset style</button>
<div class="note">Tip on iPhone: open this file in Safari rather than the in-app file preview if interactive controls do not respond.</div>
</aside>

<main>
<div class="grid" id="grid"></div>
</main>
</div>
</div>

<script>
const letters="ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
const S=()=>({
 complexity:+document.getElementById("complexity").value,
 curvature:+document.getElementById("curvature").value,
 jitter:+document.getElementById("jitter").value,
 weight:+document.getElementById("weight").value
});
function hash(s){let h=2166136261>>>0;for(const ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){return function(){let t=seed+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
const base=[[22,22],[50,22],[78,22],[22,50],[50,50],[78,50],[22,78],[50,78],[78,78]];
function glyph(letter,state){
 const seed=hash("ninehole:"+letter), r=rng(seed);
 const pts=base.map(([x,y])=>[x+(r()-.5)*state.jitter,y+(r()-.5)*state.jitter]);
 let ids=[0,1,2,3,4,5,6,7,8];
 for(let i=ids.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}
 ids=ids.slice(0,state.complexity);
 let d=`M ${pts[ids[0]][0]} ${pts[ids[0]][1]}`;
 for(let i=1;i<ids.length;i++){
   const a=pts[ids[i-1]],b=pts[ids[i]];
   if(state.curvature<8)d+=` L ${b[0]} ${b[1]}`;
   else{
    const dx=b[0]-a[0],dy=b[1]-a[1],len=Math.max(1,Math.hypot(dx,dy));
    const bend=(state.curvature/100)*10*(i%2?1:-1);
    const mx=(a[0]+b[0])/2-dy/len*bend,my=(a[1]+b[1])/2+dx/len*bend;
    d+=` Q ${mx} ${my} ${b[0]} ${b[1]}`;
   }
 }
 return {seed,d};
}
function svgFor(letter){
 const state=S(),g=glyph(letter,state);
 return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="${g.d}" fill="none" stroke="#f1efe8" stroke-width="${state.weight}" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function render(){
 const current=(document.getElementById("letter").value||"A").toUpperCase().replace(/[^A-Z]/g,"")[0]||"A";
 document.getElementById("letter").value=current;
 document.getElementById("big").innerHTML=svgFor(current);
 const grid=document.getElementById("grid");grid.innerHTML="";
 for(const L of letters){
   const g=glyph(L,S());
   const card=document.createElement("div");card.className="card";
   card.innerHTML=`<div class="glyph">${svgFor(L)}</div><div class="cap"><b>${L}</b><span class="seed">${g.seed}</span></div>`;
   card.onclick=()=>{document.getElementById("letter").value=L;render()};
   grid.appendChild(card);
 }
}
["letter","complexity","curvature","jitter","weight"].forEach(id=>document.getElementById(id).addEventListener("input",render));
document.getElementById("reset").onclick=()=>{complexity.value=5;curvature.value=42;jitter.value=7;weight.value=3;render()};
render();
</script>
</body>
</html>
