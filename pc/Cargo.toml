[package]
name = "cortical-flythrough"
version = "1.0.0"
edition = "2021"
description = "Ray-marched cortical flythrough — native build"
publish = false

[dependencies]
wgpu = "30.0"
winit = "0.30.13"
egui = "0.36"
egui-wgpu = "0.36"
egui-winit = { version = "0.36", default-features = false }
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pollster = "1"
arboard = { version = "3", default-features = false }
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
naga = { version = "30.0", features = ["wgsl-in", "spv-out", "hlsl-out", "glsl-out"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
