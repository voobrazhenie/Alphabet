<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello World 2</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    background: #fdfcf7;
    color: #111;
  }
  .card {
    border: 4px solid #111;
    box-shadow: 8px 8px 0 #111;
    background: #7ee0c4;
    padding: 2.5rem 3rem;
    text-align: center;
  }
  h1 { margin: 0 0 .5rem; font-size: clamp(2rem, 8vw, 3.5rem); letter-spacing: -.02em; }
  p { margin: 0; font-size: 1rem; opacity: .75; }
  @media (prefers-color-scheme: dark) {
    body { background: #14130f; color: #f5f5f0; }
    .card { border-color: #f5f5f0; box-shadow: 8px 8px 0 #f5f5f0; background: #34b894; color: #111; }
  }
</style>
</head>
<body>
  <main class="card">
    <h1>Hello, world 2</h1>
    <p>Alphabet · deployed from GitHub via Vercel</p>
  </main>
</body>
</html>
