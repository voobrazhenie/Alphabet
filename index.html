<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alphabet — realtime test</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    background: #fdfcf7;
    color: #111;
  }
  .card {
    border: 4px solid #111;
    box-shadow: 8px 8px 0 #111;
    background: #fff;
    padding: 2rem 2.5rem;
    max-width: 30rem;
  }
  h1 { margin: 0 0 .25rem; font-size: 1.75rem; letter-spacing: -.02em; }
  p { margin: 0 0 1.5rem; color: #555; }
  a { display: block; padding: .9rem 1rem; margin-top: .75rem; border: 3px solid #111; font-weight: 700; color: #111; text-decoration: none; }
  a:hover { background: #ffd84d; }
  small { display: block; margin-top: 1.5rem; color: #777; }
  @media (prefers-color-scheme: dark) {
    body { background: #14130f; color: #f5f5f0; }
    .card { border-color: #f5f5f0; box-shadow: 8px 8px 0 #f5f5f0; background: #1c1b16; }
    p { color: #aaa; }
    a { border-color: #f5f5f0; color: #f5f5f0; }
    a:hover { background: #d8a800; color: #111; }
  }
</style>
</head>
<body>
  <main class="card">
    <h1>Letter sequencer</h1>
    <p>Eight cells, eight steps. Phones claim cells and set letters; the display plays them.</p>
    <a href="/screen.html">Open the display →</a>
    <a href="/controller.html">Open the controller (phone) →</a>
    <a href="/neurons.html">Open Cortical Flythrough (ray marching) →</a>
    <small>Proof of concept. No accounts, no data stored.</small>
  </main>
</body>
</html>
