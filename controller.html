<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Sequencer — controller</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #111;
    color: #eee;
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    gap: 18px;
    padding: 16px calc(16px + env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }

  .status { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: #d33; flex: none; }
  .status.online .dot { background: #3d8; }
  .meta { margin-left: auto; font: 11px ui-monospace, monospace; color: #777; }

  .hint { font-size: 14px; color: #999; min-height: 1.2em; }
  .hint.warn { color: #f66; }

  .cells { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .cell {
    aspect-ratio: 1;
    border-radius: 14px;
    border: 2px solid #444;
    background: #1b1b1b;
    color: #eee;
    font: 800 clamp(1.5rem, 9vw, 2.4rem)/1 ui-sans-serif, system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    cursor: pointer;
  }
  .cell .idx { font: 500 11px ui-monospace, monospace; color: #777; }
  .cell.mine { background: #ffd84d; border-color: #ffd84d; color: #111; }
  .cell.mine .idx { color: #6a5a00; }
  .cell.taken { background: #191919; border-color: #2a2a2a; color: #555; }
  .cell.taken .idx { color: #3a3a3a; }
  .cell:disabled { cursor: default; }

  .panel { display: flex; flex-direction: column; gap: 12px; }
  .panel[hidden] { display: none; }
  .panel h2 { margin: 0; font-size: 15px; font-weight: 600; color: #aaa; }

  .letters { display: grid; grid-template-columns: repeat(7, 1fr); gap: 7px; }
  .letters button {
    aspect-ratio: 1;
    border-radius: 10px;
    border: 2px solid #3a3a3a;
    background: #222;
    color: #eee;
    font: 700 clamp(1rem, 4.5vw, 1.3rem)/1 ui-sans-serif, system-ui, sans-serif;
  }
  .letters button.current { background: #fff; border-color: #fff; color: #111; }

  #release {
    padding: 14px;
    border-radius: 12px;
    border: 2px solid #666;
    background: transparent;
    color: #eee;
    font: 600 15px ui-sans-serif, system-ui, sans-serif;
  }
</style>
</head>
<body>
  <div class="status" id="status">
    <span class="dot"></span><span id="statusText">Disconnected</span>
    <span class="meta" id="meta"></span>
  </div>

  <div class="hint" id="hint">Tap a free cell to take it.</div>

  <div class="cells" id="cells"></div>

  <div class="panel" id="panel" hidden>
    <h2>Your letter</h2>
    <div class="letters" id="letters"></div>
    <button id="release">Release cell</button>
  </div>

<script>
  const CELL_COUNT = 8;
  const ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';

  const statusEl = document.getElementById('status');
  const statusText = document.getElementById('statusText');
  const meta = document.getElementById('meta');
  const hint = document.getElementById('hint');
  const cellsEl = document.getElementById('cells');
  const panel = document.getElementById('panel');
  const lettersEl = document.getElementById('letters');
  const releaseBtn = document.getElementById('release');

  let cells = Array.from({ length: CELL_COUNT }, (_, i) => ({ index: i, letter: '-', owner: null }));
  let myIndex = null;
  const cellNodes = [];
  const letterNodes = [];

  for (let i = 0; i < CELL_COUNT; i++) {
    const btn = document.createElement('button');
    btn.className = 'cell';
    btn.innerHTML = '<span class="glyph">-</span><span class="idx">' + (i + 1) + '</span>';
    btn.addEventListener('click', () => claim(i));
    cellsEl.appendChild(btn);
    cellNodes.push({ btn, glyph: btn.querySelector('.glyph') });
  }

  for (const letter of ALPHABET) {
    const btn = document.createElement('button');
    btn.textContent = letter;
    btn.addEventListener('click', () => setLetter(letter));
    lettersEl.appendChild(btn);
    letterNodes.push(btn);
  }

  function render() {
    myIndex = cells.findIndex((c) => c.owner === 'me');
    if (myIndex < 0) myIndex = null;

    cells.forEach((cell, i) => {
      const { btn, glyph } = cellNodes[i];
      glyph.textContent = cell.letter;
      btn.classList.toggle('mine', cell.owner === 'me');
      btn.classList.toggle('taken', cell.owner === 'other');
      btn.disabled = cell.owner === 'other';
    });

    panel.hidden = myIndex === null;
    if (myIndex !== null) {
      const mine = cells[myIndex].letter;
      letterNodes.forEach((b) => b.classList.toggle('current', b.textContent === mine));
      hint.textContent = 'You control cell ' + (myIndex + 1) + '.';
      hint.classList.remove('warn');
    } else if (!hint.classList.contains('warn')) {
      hint.textContent = 'Tap a free cell to take it.';
    }
  }
  render();

  function send(msg) {
    if (socket && socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify(msg));
  }

  function claim(index) {
    if (cells[index].owner === 'other') return;
    if (cells[index].owner === 'me') return;
    send({ type: 'cell:claim', index });
  }

  function setLetter(letter) {
    if (myIndex === null) return;
    send({ type: 'cell:update', index: myIndex, letter });
  }

  releaseBtn.addEventListener('click', () => {
    if (myIndex === null) return;
    send({ type: 'cell:release', index: myIndex });
  });

  function warn(text) {
    hint.textContent = text;
    hint.classList.add('warn');
    setTimeout(() => { hint.classList.remove('warn'); render(); }, 1200);
  }

  const WS_URL = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/api/ws';
  let socket;
  let reconnectDelay = 500;

  function connect() {
    socket = new WebSocket(WS_URL);

    socket.addEventListener('open', () => {
      reconnectDelay = 500;
      statusEl.classList.add('online');
      statusText.textContent = 'Connected';
      send({ type: 'hello', role: 'controller' });
    });

    socket.addEventListener('message', (event) => {
      let msg;
      try { msg = JSON.parse(event.data); } catch { return; }

      if (msg.type === 'state' || msg.type === 'state:init') {
        cells = msg.cells;
        meta.textContent = 'screens: ' + msg.screens + ' · server ' + msg.instance;
        render();
      } else if (msg.type === 'cell:denied') {
        warn(msg.reason === 'taken' ? 'Someone got there first.' : 'That cell is not yours.');
      }
    });

    socket.addEventListener('close', () => {
      statusEl.classList.remove('online');
      statusText.textContent = 'Disconnected';
      meta.textContent = '';
      setTimeout(connect, reconnectDelay);
      reconnectDelay = Math.min(reconnectDelay * 2, 10000);
    });

    socket.addEventListener('error', () => socket.close());
  }

  connect();
</script>
</body>
</html>
